hello=a greeting used when meeting someone
yes=a word used to agree
no=a word used to disagree
thanks=a word used to express gratitude
apple=a round fruit that grows on trees
bread=food made from flour and baked
water=a clear liquid that people drink
milk=a white drink produced by cows
ticket=a document that allows you to travel or enter
airport=a place where planes take off and land
hotel=a building where travelers pay to stay
train=a vehicle that travels on railway tracks
morning=the early part of the day
work=an activity you do as part of a job
home=the place where you live
book=a set of pages with text to read
